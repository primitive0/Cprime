name: Build and test

on:
  push:
    branches: [trunk]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install LLVM 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all

      - name: Select GCC 14
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      # TODO: support different build profiles
      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build/
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DCMAKE_PROGRAM_PATH=/usr/lib/llvm-23/bin

      - name: Build
        run: make build

      - name: Test
        run: make test
